name: zap_media_player
description: Zap Media Player - A powerful cross-platform local media player
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Media playback
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10
  
  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # File handling
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # Networking (OpenSubtitles API)
  http: ^1.3.0
  crypto: ^3.0.6
  
  # UI utilities
  window_manager: ^0.4.3
  flutter_animate: ^4.5.2
  
  # Utilities
  intl: ^0.19.0
  collection: ^1.19.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
